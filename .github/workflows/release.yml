name: Release

# Builds gbl for macOS (Apple Silicon), Debian / Ubuntu (.deb), Fedora (.rpm) and Windows (zip).
#   - push a tag v* (git tag v0.1.0 && git push origin v0.1.0): build everything and publish a GitHub release
#   - Actions tab -> Release -> Run workflow: build everything; the packages are the run's artifacts (no release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Build
        run: make gbl

      - name: Build .app bundle
        run: sh scripts/macos_app.sh

      - name: Package
        run: |
          mkdir -p dist
          zip -r -y "dist/GBL-Port-${{ github.ref_name }}-macos-arm64.zip" "Ghost Bear's Legacy.app" README.md FOLDER_SETUP.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  build-debian:
    runs-on: ubuntu-22.04   # the oldest supported Ubuntu: the package also installs on newer Ubuntu / Debian
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libgl1-mesa-dev

      - name: Build
        run: make gbl

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0~${GITHUB_SHA::7} ;; esac
          sh packaging/linux/build_deb.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: dist/*.deb

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build deps
        run: dnf install -y git rpm-build rpmdevtools gcc make SDL2-devel mesa-libGL-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0 ;; esac
          rpmbuild -bb packaging/gblport.spec \
            --define "_sourcedir $PWD" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_version $VERSION"
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  build-windows:
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64; ships SDL2.dll beside gbl.exe
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and SDL2 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
          curl -sSfL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar xzf sdl2.tar.gz
          SDL=$PWD/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32
          sed -i "s|^prefix=.*|prefix=$SDL|" $SDL/bin/sdl2-config
          echo "SDL=$SDL" >> $GITHUB_ENV

      - name: Build
        run: make gbl WINDOWS=1 CC=x86_64-w64-mingw32-gcc SDL2_CONFIG=$SDL/bin/sdl2-config

      - name: Package
        run: |
          mkdir -p dist/GBL-Port
          cp gbl.exe $SDL/bin/SDL2.dll dist/GBL-Port/
          cp -r assets dist/GBL-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md dist/GBL-Port/
          cd dist && zip -r GBL-Port-${{ github.ref_name }}-windows-x64.zip GBL-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-debian, build-fedora, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
