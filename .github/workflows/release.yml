name: Release

# Builds gbl for macOS (Apple Silicon, zip), Linux (x86_64 tarball with SDL3 beside gbl), Fedora (.rpm) and Windows (zip) -
# the MW2 port's set (the legacy 32-bit Windows build is not released yet).
#   - push a tag v* (git tag v0.1.0 && git push origin v0.1.0): build everything and publish a GitHub release
#   - Actions tab -> Release -> Run workflow: build everything; the packages are the run's artifacts (no release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: brew install sdl3 pkgconf

      - name: Build
        run: make gbl

      - name: Build .app bundle
        run: sh scripts/macos_app.sh

      - name: Package
        run: |
          mkdir -p dist
          zip -r -y "dist/GBL-Port-${{ github.ref_name }}-macos-arm64.zip" "Ghost Bear's Legacy.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  build-linux:
    runs-on: ubuntu-22.04   # (older glibc: the tarball runs on more systems)
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # (libgl / libegl: SDL3's own build - its OpenGL / EGL video and render backends; gbl draws through SDL's GPU
          # API - Vulkan on Linux, loaded at run time; SDL3 carries the Vulkan headers - and its shaders are in the source)
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      # Ubuntu 22.04 / 24.04 have no SDL3 package: build the release from source (its video / audio backends are loaded
      # at run time, so one build serves X11 and Wayland, PulseAudio, PipeWire and ALSA) and ship libSDL3.so.0 beside gbl
      # (found through gbl's $ORIGIN rpath)
      - name: Build SDL3
        run: |
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz
          tar xzf sdl3.tar.gz
          cmake -S SDL3-${SDL3_VERSION} -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/sdl3 \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build
          echo "PKG_CONFIG_PATH=$PWD/sdl3/lib/pkgconfig" >> $GITHUB_ENV
          echo "SDL3_DIR=$PWD/sdl3" >> $GITHUB_ENV

      - name: Build
        run: make gbl RPATH='$$ORIGIN'

      - name: Package
        run: |
          mkdir -p dist/GBL-Port
          readelf -d gbl | grep -q 'RUNPATH.*\$ORIGIN\|RPATH.*\$ORIGIN'
          cp gbl dist/GBL-Port/
          cp -L $SDL3_DIR/lib/libSDL3.so.0 dist/GBL-Port/
          cp -r assets dist/GBL-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md dist/GBL-Port/
          cd dist && tar czf GBL-Port-${{ github.ref_name }}-linux-x86_64.tar.gz GBL-Port

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build deps
        run: dnf install -y git rpm-build rpmdevtools gcc make pkgconf-pkg-config SDL3-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0 ;; esac
          rpmbuild -bb packaging/gblport.spec \
            --define "_sourcedir $PWD" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_version $VERSION"
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  build-windows:
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64; ships SDL3.dll beside gbl.exe
    env:
      SDL3_VERSION: 3.4.18
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and SDL3 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip pkg-config
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-devel-${SDL3_VERSION}-mingw.tar.gz
          tar xzf sdl3.tar.gz
          SDL=$PWD/SDL3-${SDL3_VERSION}/x86_64-w64-mingw32
          echo "SDL=$SDL" >> $GITHUB_ENV

      - name: Build
        run: make gbl WINDOWS=1 CC=x86_64-w64-mingw32-gcc PKG_CONFIG_PATH=$SDL/lib/pkgconfig

      - name: Package
        run: |
          mkdir -p dist/GBL-Port
          cp gbl.exe $SDL/bin/SDL3.dll dist/GBL-Port/
          cp -r assets dist/GBL-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md dist/GBL-Port/
          cd dist && zip -r GBL-Port-${{ github.ref_name }}-windows-x64.zip GBL-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-linux, build-fedora, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
