name: Release

# Builds gbl for macOS (Apple Silicon), Debian / Ubuntu (.deb), Fedora (.rpm), Windows (zip) and the legacy Windows build
# (32-bit, Windows XP and newer, OpenGL 1.2: windows-x86-legacy zip).
#   - push a tag v* (git tag v0.1.0 && git push origin v0.1.0): build everything and publish a GitHub release
#   - Actions tab -> Release -> Run workflow: build everything; the packages are the run's artifacts (no release)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        run: brew install sdl3 pkgconf

      - name: Build
        run: make gbl

      - name: Build .app bundle
        run: sh scripts/macos_app.sh

      - name: Package
        run: |
          mkdir -p dist
          zip -r -y "dist/GBL-Port-${{ github.ref_name }}-macos-arm64.zip" "Ghost Bear's Legacy.app" README.md FOLDER_SETUP.md

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  build-debian:
    runs-on: ubuntu-22.04   # the oldest supported Ubuntu: the package also installs on newer Ubuntu / Debian
    env:
      SDL3_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      # Ubuntu has no SDL3 package: build it from the release tarball; the .deb ships libSDL3.so.0 in /usr/lib/gblport
      # (gbl finds it there through its rpath). X11 / Wayland / ALSA / PulseAudio / PipeWire are loaded at run time.
      - name: Build SDL3
        run: |
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz
          tar xzf sdl3.tar.gz
          cmake -S SDL3-${SDL3_VERSION} -B sdl3-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/sdl3 \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build
          echo "PKG_CONFIG_PATH=$PWD/sdl3/lib/pkgconfig" >> $GITHUB_ENV
          echo "SDL3_LIB=$PWD/sdl3/lib/libSDL3.so.0" >> $GITHUB_ENV

      - name: Build
        run: make gbl RPATH='$$ORIGIN/../lib/gblport'

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0~${GITHUB_SHA::7} ;; esac
          sh packaging/linux/build_deb.sh "$VERSION" "$SDL3_LIB"

      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: dist/*.deb

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build deps
        run: dnf install -y git rpm-build rpmdevtools gcc make pkgconf-pkg-config SDL3-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0 ;; esac
          rpmbuild -bb packaging/gblport.spec \
            --define "_sourcedir $PWD" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_version $VERSION"
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*.rpm

  build-windows:
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64; ships SDL3.dll beside gbl.exe
    env:
      SDL3_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 and SDL3 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip pkg-config
          curl -sSfL -o sdl3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-devel-${SDL3_VERSION}-mingw.tar.gz
          tar xzf sdl3.tar.gz
          SDL=$PWD/SDL3-${SDL3_VERSION}/x86_64-w64-mingw32
          echo "SDL=$SDL" >> $GITHUB_ENV

      - name: Build
        run: make gbl WINDOWS=1 CC=x86_64-w64-mingw32-gcc PKG_CONFIG_PATH=$SDL/lib/pkgconfig

      - name: Package
        run: |
          mkdir -p dist/GBL-Port
          cp gbl.exe $SDL/bin/SDL3.dll dist/GBL-Port/
          cp -r assets dist/GBL-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md dist/GBL-Port/
          cd dist && zip -r GBL-Port-${{ github.ref_name }}-windows-x64.zip GBL-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  build-windows-legacy:
    # the legacy build for Windows XP-era PCs: 32-bit, SDL2 (SDL3 does not run on XP), the OpenGL 1.2 renderer (RB=gl12),
    # SSE2 (Pentium 4 / Athlon 64 or newer); ships SDL2.dll beside gbl.exe. Modern PCs: the windows-x64 zip
    runs-on: ubuntu-24.04
    env:
      SDL2_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686) and SDL2 (MinGW development package)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 pkg-config zip
          curl -sSfL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz
          tar xzf sdl2.tar.gz
          echo "SDL2_PREFIX=$PWD/SDL2-${SDL2_VERSION}/i686-w64-mingw32" >> $GITHUB_ENV

      - name: Build
        run: make gbl WINDOWS=1 RB=gl12 SDL=2 CC=i686-w64-mingw32-gcc SDL2_DIR=$SDL2_PREFIX

      - name: Check the imports (every DLL function Windows XP SP3 has, no MinGW runtime DLL)
        run: |
          i686-w64-mingw32-objdump -p gbl.exe | grep -E "DLL Name|^\s+[0-9a-f]+\s+[0-9]+ " > imports.txt
          cat imports.txt
          if grep -i -E "api-ms-win|ucrtbase|GetTickCount64|ConditionVariable|GetThreadId|SetFileInformationByHandle|GetFileInformationByHandleEx|_putenv_s|InitOnce|SRWLock|FlsAlloc|InitializeCriticalSectionEx|GetFinalPathNameByHandle|CreateSymbolicLink|libwinpthread|libgcc_s|libstdc" imports.txt; then
            echo "gbl.exe imports a function or DLL Windows XP does not have" >&2; exit 1
          fi
          i686-w64-mingw32-objdump -p gbl.exe | grep -E "MajorSubsystemVersion\s+[45]$"

      - name: Package
        run: |
          mkdir -p dist/GBL-Port
          cp gbl.exe $SDL2_PREFIX/bin/SDL2.dll dist/GBL-Port/
          cp -r assets dist/GBL-Port/
          cp README.md FOLDER_SETUP.md THIRD_PARTY.md packaging/windows/README-legacy.txt dist/GBL-Port/
          cd dist && zip -r GBL-Port-${{ github.ref_name }}-windows-x86-legacy.zip GBL-Port

      - uses: actions/upload-artifact@v4
        with:
          name: windows-legacy
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-debian, build-fedora, build-windows, build-windows-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
